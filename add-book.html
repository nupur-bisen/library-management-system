<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        header {
            background: #1f6f4a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .box {
            background: white;
            width: 400px;
            max-width: 90%;
            margin: 45px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 9px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #1f6f4a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #155536;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f6f4a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Library Management System</h1>
    </header>

    <div class="box">

        <h2>➕ Add Book</h2>

        <input
            type="text"
            id="title"
            placeholder="Enter Book Title"
        >

        <input
            type="text"
            id="author"
            placeholder="Enter Author Name"
        >

        <input
            type="text"
            id="category"
            placeholder="Enter Category"
        >

        <input
            type="number"
            id="quantity"
            placeholder="Enter Quantity"
            min="1"
        >

        <button type="button" onclick="addBook()">
            Add Book
        </button>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

    <script>
        async function addBook() {

            const title =
                document.getElementById("title").value.trim();

            const author =
                document.getElementById("author").value.trim();

            const category =
                document.getElementById("category").value.trim();

            const quantity =
                document.getElementById("quantity").value;

            const message =
                document.getElementById("message");

            if (
                title === "" ||
                author === "" ||
                category === "" ||
                quantity === ""
            ) {
                message.innerHTML =
                    "Please fill all fields";

                message.style.color = "red";
                return;
            }

            try {

                const response = await fetch(
                    "http://localhost:5000/api/books",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            title: title,
                            author: author,
                            category: category,
                            quantity: Number(quantity)
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {

                    message.innerHTML =
                        "Book added successfully!";

                    message.style.color = "green";

                    document.getElementById("title").value = "";
                    document.getElementById("author").value = "";
                    document.getElementById("category").value = "";
                    document.getElementById("quantity").value = "";

                } else {

                    message.innerHTML =
                        data.message || "Book add nahi hua";

                    message.style.color = "red";
                }

            } catch (error) {

                console.log(error);

                message.innerHTML =
                    "Backend se connection nahi ho raha";

                message.style.color = "red";
            }
        }
    </script>

</body>

</html>
