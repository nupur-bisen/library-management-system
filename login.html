<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        header {
            background: #1f6f4a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .login-box {
            background: white;
            width: 380px;
            max-width: 90%;
            margin: 60px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #1f6f4a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #155536;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f6f4a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Library Management System</h1>
    </header>

    <div class="login-box">

        <h2>🔐 Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button type="button" onclick="login()">
            Login
        </button>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

    <script>
        function login() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value.trim();

            const message =
                document.getElementById("message");

            if (username === "" || password === "") {

                message.innerHTML =
                    "Please enter username and password";

                message.style.color = "red";
                return;
            }

            message.innerHTML = "Login successful!";

            message.style.color = "green";
        }
    </script>

</body>

</html>
